name: CI / Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # create releases on tags
  packages: write   # push the Docker image to ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Browser E2E uses the runner's Google Chrome (H.264/AAC support for real playback tests)
      - run: google-chrome --version
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-results, path: test-results, retention-days: 7 }

  android:
    needs: test
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.PETETV_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build && npx cap sync android
      - name: Use release signing key (if configured)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.PETETV_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PETETV_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: android
        env:
          PETETV_KEYSTORE_PASSWORD: ${{ secrets.PETETV_KEYSTORE_PASSWORD }}
          PETETV_KEY_ALIAS: ${{ secrets.PETETV_KEY_ALIAS }}
          PETETV_KEY_PASSWORD: ${{ secrets.PETETV_KEY_PASSWORD }}
        run: |
          # empty secrets must not override the dev-key defaults
          for v in PETETV_KEYSTORE_PASSWORD PETETV_KEY_ALIAS PETETV_KEY_PASSWORD; do [ -z "${!v}" ] && unset $v; done
          ./gradlew assembleRelease --no-daemon
      - name: Collect APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/PeteTV-$VERSION.apk"
          cp android/app/build/outputs/apk/release/app-release.apk release/PeteTV.apk
      - uses: actions/upload-artifact@v4
        with: { name: PeteTV-apk, path: release/*.apk, retention-days: 30 }
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          generate_release_notes: true

  docker:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TAGS="$IMAGE:latest"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then TAGS="$TAGS,$IMAGE:${GITHUB_REF_NAME#v}"; fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
